packages:
  - apps/*
  - packages/*
# Transitive CVE fixes (docs/security/): only what the lockfile would otherwise resolve to a
# vulnerable version, each bounded to its major — except deepmerge-ts, fixed only in 8.
# Checked by removing them all and running `pnpm audit` (2026-10-13).
overrides:
  ws@>=8.0.0 <8.21.0: '>=8.21.0 <9'
  multer@<2.5.0: '>=2.5.0 <3'
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0 <3'
  qs@>=6.0.0 <6.16.1: '>=6.16.1 <7'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5'
  js-yaml@>=5.0.0 <5.4.1: '>=5.4.1 <6'
  mysql2@<3.23.1: '>=3.23.1 <4'
  deepmerge-ts@<8.0.0: '>=8.0.0 <9'
  # Development and build tooling only (tests): nothing the images ship.
  handlebars@<4.7.10: '>=4.7.10 <5'
  markdown-it@<14.3.3: '>=14.3.3 <15'
  undici@>=7.0.0 <7.30.1: '>=7.30.1 <8'
  zod@>=4.0.0 <4.6.6: '>=4.6.6 <5'
patchedDependencies:
  # Zod 4.5+ writes a nullable field as `type: [x, 'null']`, which nestjs-zod hands to
  # @nestjs/swagger as an array: back to the `anyOf` form it expects. Drop once fixed
  # upstream (BenLorantfy/nestjs-zod#473).
  nestjs-zod@5.4.0: patches/nestjs-zod@5.4.0.patch
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
