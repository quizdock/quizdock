packages:
  - apps/*
  - packages/*
# CVE fixes (docs/security/): only what the lockfile would otherwise resolve to a
# vulnerable version, each bounded to its major — except deepmerge-ts, fixed only in 8.
# Checked by removing them all and running `pnpm audit` (2026-10-13).
overrides:
  ws@>=8.0.0 <8.21.0: '>=8.21.0 <9'
  multer@<2.5.0: '>=2.5.0 <3'
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0 <3'
  # Preserve existing OpenAPI and versioned bundle schemas with the patch below.
  zod@>=4.0.0 <4.6.6: '4.6.6'
  vite@>=6.0.0 <6.4.4: '>=6.4.4 <7'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5'
  js-yaml@>=5.0.0 <5.4.1: '>=5.4.1 <6'
  mysql2@<3.23.1: '>=3.23.1 <4'
  deepmerge-ts@<8.0.0: '>=8.0.0 <9'
  # Development and build tooling only (tests): nothing the images ship.
  handlebars@<4.7.10: '>=4.7.10 <5'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
patchedDependencies:
  zod@4.6.6: patches/zod@4.6.6.patch
