# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# QuizDock in Authentik: the application, its OpenID Connect provider, its
# roles, and two demonstration accounts. The `full` setup with Authentik loads
# it on first start; on an Authentik of your own, import it from the admin
# interface (Customization → Blueprints) after setting the variables below in
# the worker's environment, or copy what you need by hand.
#
# Worker environment:
#   QUIZDOCK_APP_URL             QuizDock's address as browsers see it (APP_PUBLIC_URL)
#   QUIZDOCK_OIDC_CLIENT_SECRET  the client's secret, also OIDC_CLIENT_SECRET on QuizDock
#   QUIZDOCK_HOST_PASSWORD       the `host` account's password
#   QUIZDOCK_PLAYER_PASSWORD     the `player` account's password
#
# QuizDock's side:
#   OIDC_ISSUER=<Authentik>/application/o/quiz-dock/   (trailing slash included)
#   OIDC_CLIENT_ID=quiz-dock
#   OIDC_CLIENT_SECRET=<QUIZDOCK_OIDC_CLIENT_SECRET>
#   OIDC_SCOPE=openid profile email entitlements offline_access
#   OIDC_ROLES_CLAIM=roles
#
# Every entry is `state: created`: made once, never overwritten when Authentik
# applies the blueprint again. What you change in the interface stays.
version: 1
metadata:
  name: QuizDock
  labels:
    blueprints.goauthentik.io/description: QuizDock application, provider, roles and demo accounts
entries:
  # The provider: Authorization Code with PKCE, a confidential client (the
  # QuizDock backend keeps the secret and the tokens; the browser never sees them).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: created
    identifiers:
      name: QuizDock
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: quiz-dock
      client_secret: !Env QUIZDOCK_OIDC_CLIENT_SECRET
      # A refresh token keeps the session alive past the access token's lifetime;
      # Authentik gives one only for the `offline_access` scope.
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: !Format ['%s/auth/callback', !Env QUIZDOCK_APP_URL]
        - matching_mode: strict
          url: !Env QUIZDOCK_APP_URL
          redirect_uri_type: logout
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # `entitlements` puts the application's entitlements in the `roles` claim,
      # in the ID token: QuizDock reads its roles there.
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-offline_access],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-entitlements],
          ]

  # The issuer is <Authentik>/application/o/<slug>/.
  - model: authentik_core.application
    id: app
    state: created
    identifiers:
      slug: quiz-dock
    attrs:
      name: QuizDock
      provider: !KeyOf provider
      meta_launch_url: !Env QUIZDOCK_APP_URL

  # QuizDock's roles are the application's entitlements, each granted to a group:
  # put an account in a group to give it the role.
  #   admin   administers the instance
  #   host    hosts quizzes and creates them
  #   player  signed-in participant
  - model: authentik_core.group
    id: admins
    state: created
    identifiers:
      name: QuizDock admins
  - model: authentik_core.group
    id: hosts
    state: created
    identifiers:
      name: QuizDock hosts
  - model: authentik_core.group
    id: players
    state: created
    identifiers:
      name: QuizDock players

  - model: authentik_core.applicationentitlement
    id: admin
    state: created
    identifiers:
      app: !KeyOf app
      name: admin
  - model: authentik_core.applicationentitlement
    id: host
    state: created
    identifiers:
      app: !KeyOf app
      name: host
  - model: authentik_core.applicationentitlement
    id: player
    state: created
    identifiers:
      app: !KeyOf app
      name: player

  - model: authentik_policies.policybinding
    state: created
    identifiers:
      target: !KeyOf admin
      group: !KeyOf admins
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    state: created
    identifiers:
      target: !KeyOf host
      group: !KeyOf hosts
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    state: created
    identifiers:
      target: !KeyOf player
      group: !KeyOf players
    attrs:
      order: 0

  # Demonstration accounts, as in the Keycloak realm: remove them, or change
  # their passwords, before opening the instance to others.
  - model: authentik_core.user
    state: created
    identifiers:
      username: host
    attrs:
      name: Alex Host
      email: host@quiz-dock.test
      password: !Env QUIZDOCK_HOST_PASSWORD
      groups:
        - !KeyOf admins
        - !KeyOf hosts
  - model: authentik_core.user
    state: created
    identifiers:
      username: player
    attrs:
      name: Sam Player
      email: player@quiz-dock.test
      password: !Env QUIZDOCK_PLAYER_PASSWORD
      groups:
        - !KeyOf players
